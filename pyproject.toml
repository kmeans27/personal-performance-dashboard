[project]
name = "pulse"
version = "2.1.2"
description = "Pulse — a personal performance dashboard. One glance, three rings, one score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
pulse = "pulse.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
